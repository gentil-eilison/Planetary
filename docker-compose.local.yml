services:
  x-shared-config: &django_config
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    env_file:
      - .envs/local/.django
    volumes:
      - ./:/app

  django:
    <<: *django_config
    ports:
      - '8000:8000'
    depends_on:
      - postgres

  postgres:
    image: postgres:17
    env_file:
      - .envs/local/.postgres
    volumes:
      - postgres_local_data:/var/lib/postgresql/data

  redis:
    image: redis:latest

  celery:
    <<: *django_config
    entrypoint: /app/compose/local/celery/entrypoint.sh
    depends_on:
      - redis
      - django
      - postgres


volumes:
  postgres_local_data: {}
