services:
  django:
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    ports:
      - '8000:8000'
    env_file:
      - .envs/local/.django
    depends_on:
      - postgres
    volumes:
      - ./:/app

  postgres:
    image: postgres:17
    env_file:
      - .envs/local/.postgres
    volumes:
      - postgres_local_data:/var/lib/postgresql/data

volumes:
  postgres_local_data: {}
